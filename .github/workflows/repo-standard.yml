name: Repo Standard

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-standard:
    name: repo-standard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate repository standard
        env:
          REPO_STANDARD_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: python3 .repo/scripts/repo_check.py --ci
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run agent-readiness tests
        run: npm test
      - name: Build Eleventy site
        run: npm run build
      - name: Verify deployed agent-readiness behavior
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            bash tests/agent-readiness-live.sh "https://deploy-preview-${PR_NUMBER}--mos2es.netlify.app"
            bash tests/agent-readiness-live.sh "https://mos2es.com"
          else
            for attempt in 1 2 3 4 5 6; do
              if bash tests/agent-readiness-live.sh "https://mos2es.com"; then
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "agent-readiness-live: failed after 6 attempts"
                exit 1
              fi
              echo "attempt $attempt failed, waiting 30s for deployment to propagate..."
              sleep 30
            done
          fi
