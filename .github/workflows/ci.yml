name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Build Eleventy site
        run: npm run build
      - name: Check the live site
        if: github.event_name == 'push'
        run: |
          for attempt in 1 2 3 4 5 6; do
            if bash tests/agent-readiness-live.sh "https://mos2es.com"; then exit 0; fi
            [ "$attempt" -eq 6 ] && { echo "live check failed after 6 attempts"; exit 1; }
            echo "attempt $attempt failed, waiting 30s"; sleep 30
          done
