[build]
  command = "npm run build"
  publish = "_site"
  edge_functions = "src/edge-functions"

[[edge_functions]]
  function = "markdown"
  path = "/*"
  excludedPath = [
    "/img/*",
    "/assets/*",
    "/uploads/*",
    "/docs/*",
    "/*.js",
    "/*.css",
    "/*.xml",
    "/*.txt",
    "/*.json",
    "/*.png",
    "/*.jpg",
    "/*.jpeg",
    "/*.gif",
    "/*.svg",
    "/*.webp",
    "/*.ico",
    "/*.pdf",
    "/*.zip"
  ]
